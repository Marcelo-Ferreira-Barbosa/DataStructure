packages:
  - apps/*
  - packages/*

# Versões compartilhadas: os pacotes referenciam com "catalog:".
catalog:
  typescript: 6.0.3
  vitest: 5.1.0
  '@types/node': 22.20.5
  '@vitest/coverage-v8': 5.1.0

# Scripts de instalação (política do pnpm): só o esbuild, que valida seu binário nativo, roda.
# Prisma: os scripts de instalação ficam DESLIGADOS de propósito (false = decisão registrada, não
# esquecimento). O comando `prisma generate` baixa o que precisa sob demanda, sem script de
# instalação de terceiros rodando em `pnpm install`.
allowBuilds:
  esbuild: true
  '@prisma/engines': false
  prisma: false
