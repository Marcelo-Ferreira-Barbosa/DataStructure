name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo ramo/PR quando chega um commit novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # A versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v6

      # A versão do Node vem do .nvmrc; o cache usa o pnpm-lock.yaml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mesmas etapas do `pnpm check` local, separadas para o resultado ficar legível.
      - name: Formatação
        run: pnpm format:check
      - name: Análise estática
        run: pnpm lint
      - name: Verificação de tipos
        run: pnpm typecheck
      - name: Testes com cobertura da Engine
        run: pnpm test:coverage
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
